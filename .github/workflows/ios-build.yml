
name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iOS App
        run: |
          xcodebuild \
            -project FlowiOS.xcodeproj \
            -scheme FlowiOS \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package App
        run: |
          cd build/DerivedData/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/FlowiOS-App.zip" FlowiOS.app

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: FlowiOS-App
          path: FlowiOS-App.zip
